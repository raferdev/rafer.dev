
worker_processes auto;

worker_rlimit_nofile 8192;

events {
  worker_connections 8000;
}

http {

  map $uri $cache_control {
    default                              "public, max-age=0, must-revalidate";
    ~^/_next/static/                     "public, max-age=31536000, immutable";
    "~\.[0-9a-f]{8}\.iframe\.bundle\.js$"  "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|ico|svg|webp|avif|woff2?)$  "public, max-age=86400";
  }

  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-XSS-Protection "1; mode=block";
  add_header Content-Security-Policy "worker-src blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.googletagmanager.com; frame-src 'self' *.youtube.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self';";
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
  add_header Referrer-Policy "strict-origin";
  add_header Permissions-Policy "geolocation=(self),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(),payment=()";
  add_header X-Content-Type-Options nosniff;
  add_header Cache-Control $cache_control;
  add_header Timing-Allow-Origin "*";

  gzip on;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_vary on;
  gunzip on;
  gzip_types
  application/atom+xml
  application/geo+json
  application/javascript
  application/x-javascript
  application/json
  application/ld+json
  application/manifest+json
  application/rdf+xml
  application/rss+xml
  application/vnd.ms-fontobject
  application/wasm
  application/x-web-app-manifest+json
  application/xhtml+xml
  application/xml
  font/eot
  font/otf
  font/ttf
  image/bmp
  image/svg+xml
  image/vnd.microsoft.icon
  image/x-icon
  text/cache-manifest
  text/calendar
  text/css
  text/javascript
  text/markdown
  text/plain
  text/xml
  text/vcard
  text/vnd.rim.location.xloc
  text/vtt
  text/x-component
  text/x-cross-domain-policy;


  charset utf-8;

  access_log off;
  server_tokens off;

  include conf/mime.types;

  default_type application/octet-stream;

  index index.html;

  server {

    listen 80;
    server_name raferdev.com www.raferdev.com;
    return 301 https://rafer.dev$request_uri;
  }

  server {

    listen 80;
    server_name www.rafer.dev;
    return 301 https://rafer.dev$request_uri;
  }

  server {

    server_name rafer.dev;

    listen 80;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    root /www/data/out;
    sendfile on;
    sendfile_max_chunk 1m;
    keepalive_timeout 20s;
    tcp_nodelay on;
    tcp_nopush on;


    location / {
      gzip_static on;
      try_files $uri $uri.html $uri/ =404;
    }


    location ~* \.(?:css|js|jpg|svg)$ {
      gzip_static on;
      try_files $uri $uri/ $uri.html /iframe.html /index.html;

    }

    location ~* \.(?:json)$ {
      gzip_static on;
      try_files $uri $uri/ $uri.html /iframe.html /index.html;
    }

    location ~* (?:#.*#|\.(?:bak|conf|dist|fla|in[ci]|log|orig|psd|sh|sql|sw[op])|~)$ {
      deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
      gzip_static on;
      internal;
    }

  }

  server {

    server_name storybook.rafer.dev www.storybook.rafer.dev;

    listen 80;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    root /www/data/storybook-static;

    sendfile on;
    sendfile_max_chunk 1m;

    keepalive_timeout 65;
    tcp_nodelay on;
    tcp_nopush on;


    location / {
      try_files $uri $uri.html $uri/ =404;
      gzip_static on;
    }

    location ~* \.(?:css|js|jpg|svg)$ {
      gzip_static on;
      try_files $uri $uri/ $uri.html /iframe.html /index.html;

    }

    location ~* \.(?:json)$ {
      gzip_static on;
      try_files $uri $uri/ $uri.html /iframe.html /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
      gzip_static on;
      internal;
    }

    location ~* (?:#.*#|\.(?:bak|conf|dist|fla|in[ci]|log|orig|psd|sh|sql|sw[op])|~)$ {
      deny all;
    }
  }
}