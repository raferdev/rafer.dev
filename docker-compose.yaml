services:
  ngnix:
    container_name: server
    restart: always
    build: ./nginx
    volumes:
      - ${SITE_ROOT:-/srv/rafer.dev}:/www/data:ro
    mem_limit: '256m'
    tty: false
    stdin_open: false
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    ports:
      - 80:80
