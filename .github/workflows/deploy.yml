name: Build and Deploy
concurrency:
  group: production
  cancel-in-progress: true

on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node & Pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.14.1
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Create env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > apps/web/.env
          echo "${{ secrets.ENV_LOCAL_FILE }}" > apps/web/.env.local

      - name: Install Deps
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: Build Storybook
        run: pnpm run build.storybook

      - name: Upload Landing Page Files
        uses: actions/upload-artifact@v3
        with:
          name: landing-page
          path: apps/web/out
          retention-days: 1
      - name: Upload Storybook Files
        uses: actions/upload-artifact@v3
        with:
          name: storybook
          path: packages/book-ui/storybook-static
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: https://rafer.dev
    steps:
      - name: Download Storybook
        uses: actions/download-artifact@v3
        with:
          name: storybook
          path: storybook-static
      - name: Download Landing Page
        uses: actions/download-artifact@v3
        with:
          name: landing-page
          path: out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync landing page to S3
        run: |
          aws s3 sync ./out "s3://${{ vars.LANDING_BUCKET }}" --delete

      - name: Sync storybook to S3
        run: |
          aws s3 sync ./storybook-static "s3://${{ vars.STORYBOOK_BUCKET }}" --delete

      - name: Invalidate CloudFront caches
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.LANDING_DISTRIBUTION_ID }}" --paths "/*"
          aws cloudfront create-invalidation --distribution-id "${{ vars.STORYBOOK_DISTRIBUTION_ID }}" --paths "/*"
